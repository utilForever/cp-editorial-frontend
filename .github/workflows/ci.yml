name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Static analysis
        run: npm run analyze

      - name: Cache editorial preview images
        uses: actions/cache@v6
        with:
          path: .cache/route-previews
          key: ${{ runner.os }}-${{ runner.arch }}-route-previews-${{ steps.node.outputs.node-version }}-${{ hashFiles('scripts/generate-route-previews.mjs', 'scripts/assets/fonts/*.otf', 'scripts/assets/fonts/*.ttf', 'public/images/editorial-info-base.png', 'package-lock.json') }}-${{ hashFiles('public/data/editorial-index.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-route-previews-${{ steps.node.outputs.node-version }}-${{ hashFiles('scripts/generate-route-previews.mjs', 'scripts/assets/fonts/*.otf', 'scripts/assets/fonts/*.ttf', 'public/images/editorial-info-base.png', 'package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Install browser for regression tests
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm test
